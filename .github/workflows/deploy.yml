name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/research-monetization-ideas-HvId5"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: whatsapp-bot-negocio/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: whatsapp-bot-negocio

      - name: Build
        run: npm run build
        working-directory: whatsapp-bot-negocio

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: whatsapp-bot-negocio/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
