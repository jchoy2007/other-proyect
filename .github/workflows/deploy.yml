name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/research-monetization-ideas-HvId5"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci
        working-directory: whatsapp-bot-negocio

      - name: Build
        run: npm run build
        working-directory: whatsapp-bot-negocio

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: whatsapp-bot-negocio/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
